name: ListenToMe
options:
  bundleIdPrefix: com.rexdanquah
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# First SPM dependency. FluidAudio (Apache-2.0) provides Parakeet TDT v3 on
# Core ML / ANE for the Wave 8 ASR A/B benchmark. Pinned exact — bump
# deliberately, never floating.
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.2

targets:
  ListenToMe:
    type: application
    platform: macOS
    sources:
      - path: ListenToMe
        excludes:
          - "Info.plist"
          - "ListenToMe.entitlements"
          - "Resources/**"
          # CWhisper / CLlama headers are picked up via SWIFT_INCLUDE_PATHS /
          # HEADER_SEARCH_PATHS below, not as sources to compile.
          - "CWhisper/**"
          - "CLlama/**"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    postBuildScripts:
      - name: Copy whisper binaries + dylibs into bundle
        script: |
          set -e
          SRC="${SRCROOT}/ListenToMe/Resources"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          cp "$SRC/whisper-cli" "$DEST/whisper-cli"
          chmod +x "$DEST/whisper-cli"
          if [ -f "$SRC/whisper-server" ]; then
            cp "$SRC/whisper-server" "$DEST/whisper-server"
            chmod +x "$DEST/whisper-server"
          fi
          # Bundle every prebuilt dylib alongside the binary
          shopt -s nullglob
          for dylib in "$SRC"/*.dylib; do
            cp "$dylib" "$DEST/$(basename "$dylib")"
          done
        inputFiles:
          - $(SRCROOT)/ListenToMe/Resources/whisper-cli
          - $(SRCROOT)/ListenToMe/Resources/whisper-server
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/whisper-cli
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/whisper-server
      # Separate, UNGATED phase: copies llama.cpp's renamed-ggml set from
      # Resources/llm/ into the bundle. No inputFiles/outputFiles so Xcode
      # never skips it (the whisper phase above is gated on whisper-cli and
      # would otherwise swallow llm changes). cp clears stale files first so
      # a rename in build-llama.sh can't leave old dylibs behind.
      - name: Copy llama (llm) dylibs into bundle
        script: |
          set -e
          SRC="${SRCROOT}/ListenToMe/Resources/llm"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/llm"
          rm -rf "$DEST"
          if [ -d "$SRC" ]; then
            mkdir -p "$DEST"
            cp -R "$SRC/." "$DEST/"
          fi
    info:
      path: ListenToMe/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: ListenToMe
        CFBundleDisplayName: ListenToMe
        CFBundleIdentifier: com.rexdanquah.listentome
        CFBundleShortVersionString: "0.14.0"
        CFBundleVersion: "25"
        NSHumanReadableCopyright: "© 2026 Rex Danquah"
        NSMicrophoneUsageDescription: "ListenToMe needs microphone access to transcribe your speech."
        NSAppleEventsUsageDescription: "ListenToMe uses Apple Events to paste transcripts into the active app."
        NSHighResolutionCapable: true
    entitlements:
      path: ListenToMe/ListenToMe.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        # Required so the bundled adhoc-signed libwhisper/libggml*
        # dylibs load under Release's hardened runtime. See the
        # entitlements file for the full rationale.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rexdanquah.listentome
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CWhisper module — links the bundled libwhisper.dylib so the
        # opt-in linked-engine path (Settings → AI Cleanup → Engine →
        # Linked) can call whisper.cpp's C API directly without the
        # subprocess hop. The dylib lives in Resources/ at runtime
        # (copied by post-build script) and at link-time in the same
        # source location. @loader_path/../Resources is the runtime
        # rpath that lets the bundled dylib resolve once installed.
        # Swift imports CWhisper (ggml 0.9.8) + CLlamaBridge (clean C shim, no
        # ggml types). CLlama/include holds llama.h/ggml.h >=0.15 for textual
        # include by llama_bridge.cpp ONLY (HEADER_SEARCH_PATHS, not SWIFT_) —
        # keeping llama's ggml out of the Swift module graph so it can't clash
        # with whisper's ggml.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/ListenToMe/CWhisper/include $(SRCROOT)/ListenToMe/CLlamaBridge/include
        HEADER_SEARCH_PATHS: $(SRCROOT)/ListenToMe/CWhisper/include $(SRCROOT)/ListenToMe/CLlama/include $(SRCROOT)/ListenToMe/CLlamaBridge/include
        # Resources/ holds whisper's ggml 0.9.8 set; Resources/llm/ holds
        # llama's isolated ggml >=0.15 set + libllama (directory isolation —
        # see scripts/build-llama.sh). Both on the link + runtime search path.
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/ListenToMe/Resources $(SRCROOT)/ListenToMe/Resources/llm
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Resources @loader_path/../Resources/llm
        OTHER_LDFLAGS: -lwhisper.1 -lllama
      configs:
        # Hardened runtime (CS_RUNTIME flag) is Release-only because
        # Xcode's Debug build links a per-build ListenToMe.debug.dylib
        # for SwiftUI previews that has a different signing identity
        # than the main binary; library validation under adhoc signing
        # rejects the load and the app won't launch. Skipping the
        # runtime flag in Debug keeps the inner-loop fast; Release ships
        # are still fully hardened — verify with:
        #   codesign -d --verbose=4 ListenToMe.app  (look for runtime)
        Release:
          OTHER_CODE_SIGN_FLAGS: "--options=runtime"
          # Suppress Xcode's auto-injected debug-only entitlements
          # (com.apple.security.get-task-allow). The explicit entitlements
          # file is the only source of truth for Release; the debugger-
          # attach permission has no place in shipped builds. Verify with:
          #   codesign -d --entitlements - --xml ListenToMe.app
          #   should NOT contain "get-task-allow".
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # arm64-only Release: the bundled libwhisper.1.dylib (and
          # libggml*) ship arm64 only — they're built locally by
          # scripts/setup.sh on Apple Silicon. CLAUDE.md targets Apple
          # Silicon as the primary platform; Intel Macs run via Rosetta
          # if needed. Building x86_64 here would fail to link against
          # the arm64-only libwhisper.
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: NO

  ListenToMeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ListenToMeTests
    dependencies:
      - target: ListenToMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rexdanquah.listentome.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        # @testable import ListenToMe pulls WhisperLib's CWhisper
        # imports transitively, so the test target needs the same
        # module-search path as the app target. (Linking against
        # libwhisper isn't required — the app target carries the dep
        # already; this is just for module resolution.)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/ListenToMe/CWhisper/include $(SRCROOT)/ListenToMe/CLlamaBridge/include
        HEADER_SEARCH_PATHS: $(SRCROOT)/ListenToMe/CWhisper/include $(SRCROOT)/ListenToMe/CLlamaBridge/include

schemes:
  ListenToMe:
    build:
      targets:
        ListenToMe: all
        ListenToMeTests: [test]
    test:
      targets:
        - ListenToMeTests
